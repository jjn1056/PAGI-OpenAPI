<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 30px;
            margin-bottom: 20px;
        }
        .add-form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .add-form input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
        }
        .add-form input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        .add-form button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .add-form button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }
        .filter-btn:hover { border-color: #667eea; }
        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        .todo-list { list-style: none; }
        .todo-item {
            display: flex;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.2s;
        }
        .todo-item:hover { background: #f8f9fa; }
        .todo-item:last-child { border-bottom: none; }
        .todo-checkbox {
            width: 24px;
            height: 24px;
            margin-right: 16px;
            cursor: pointer;
            accent-color: #667eea;
        }
        .todo-content { flex: 1; }
        .todo-title {
            font-size: 16px;
            color: #333;
        }
        .todo-title.completed {
            text-decoration: line-through;
            color: #999;
        }
        .todo-desc {
            font-size: 13px;
            color: #666;
            margin-top: 4px;
        }
        .todo-date {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
        .delete-btn {
            padding: 8px 12px;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .todo-item:hover .delete-btn { opacity: 1; }
        .delete-btn:hover { background: #ff3344; }
        .empty {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            padding: 16px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
        .api-link {
            text-align: center;
            margin-top: 20px;
        }
        .api-link a {
            color: white;
            opacity: 0.8;
            text-decoration: none;
        }
        .api-link a:hover { opacity: 1; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Todo App</h1>

        <div class="card">
            <form class="add-form" onsubmit="addTodo(event)">
                <input type="text" id="newTodo" placeholder="What needs to be done?" required>
                <button type="submit">Add</button>
            </form>

            <div class="filters">
                <button class="filter-btn active" onclick="setFilter('all')">All</button>
                <button class="filter-btn" onclick="setFilter('active')">Active</button>
                <button class="filter-btn" onclick="setFilter('completed')">Completed</button>
            </div>

            <ul class="todo-list" id="todoList"></ul>

            <div class="stats" id="stats"></div>
        </div>

        <div class="api-link">
            <a href="/docs">📚 View API Documentation</a>
        </div>
    </div>

    <script>
        let todos = [];
        let filter = 'all';

        async function fetchTodos() {
            let url = '/todos';
            if (filter === 'active') url += '?completed=false';
            else if (filter === 'completed') url += '?completed=true';

            const res = await fetch(url);
            const data = await res.json();
            todos = data.todos;
            render();
        }

        async function addTodo(e) {
            e.preventDefault();
            const input = document.getElementById('newTodo');
            const title = input.value.trim();
            if (!title) return;

            await fetch('/todos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title })
            });

            input.value = '';
            fetchTodos();
        }

        async function toggleTodo(id, completed) {
            if (!completed) {
                await fetch(`/todos/${id}/complete`, { method: 'POST' });
            } else {
                await fetch(`/todos/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ completed: false })
                });
            }
            fetchTodos();
        }

        async function deleteTodo(id) {
            await fetch(`/todos/${id}`, { method: 'DELETE' });
            fetchTodos();
        }

        function setFilter(f) {
            filter = f;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent.toLowerCase() === f);
            });
            fetchTodos();
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-US', {
                month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
            });
        }

        function render() {
            const list = document.getElementById('todoList');
            const stats = document.getElementById('stats');

            if (todos.length === 0) {
                list.innerHTML = '<li class="empty">No todos yet. Add one above!</li>';
            } else {
                list.innerHTML = todos.map(todo => `
                    <li class="todo-item">
                        <input type="checkbox" class="todo-checkbox"
                            ${todo.completed ? 'checked' : ''}
                            onchange="toggleTodo(${todo.id}, ${todo.completed})">
                        <div class="todo-content">
                            <div class="todo-title ${todo.completed ? 'completed' : ''}">${escapeHtml(todo.title)}</div>
                            ${todo.description ? `<div class="todo-desc">${escapeHtml(todo.description)}</div>` : ''}
                            <div class="todo-date">${formatDate(todo.created_at)}</div>
                        </div>
                        <button class="delete-btn" onclick="deleteTodo(${todo.id})">Delete</button>
                    </li>
                `).join('');
            }

            const total = todos.length;
            const completed = todos.filter(t => t.completed).length;
            stats.innerHTML = `
                <span>${total} total</span>
                <span>${completed} completed</span>
                <span>${total - completed} remaining</span>
            `;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initial load
        fetchTodos();
    </script>
</body>
</html>
